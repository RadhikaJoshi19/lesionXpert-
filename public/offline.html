<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LesionXpert.AI — Offline Mode</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid #334155;
      max-width: 420px;
      margin: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      color: #2dd4bf;
      margin: 0 0 10px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      background: linear-gradient(135deg, #0d9488, #0f766e);
      color: white;
      border: none;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 14px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔬</div>
    <h1>LesionXpert.AI Offline</h1>
    <p>You appear to be offline or disconnected from the local clinical server. Reconnect to your network or clinical workstation to sync diagnostic records.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
